name: Dienstplan aktualisieren

on:
  schedule:
    - cron: "7 4-22/2 * * *"   # alle 2 Stunden zwischen ca. 5 und 23 Uhr (Zeiten in UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: "Fehlersuche: Screenshots der Klick-Schritte speichern"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dienstplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Dienstplan bei CareMan abholen
        env:
          CAREMAN_URL: https://dienstplan.drk-dortmund.de
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASSWORD: ${{ secrets.CAREMAN_PASSWORD }}
          PLANUNGSGRUPPE: RW 18
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: python fetch_pdf.py dienstplan.pdf

      - name: PDF auswerten
        run: python parse_dienstplan.py dienstplan.pdf data.json

      - name: Website bauen (verschlüsselt)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
                       DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          mkdir -p site
          python build_site.py data.json site/index.html
          rm -f dienstplan.pdf data.json

      - name: Screenshots zur Fehlersuche hochladen
        if: always() && (failure() || inputs.debug)
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub schaltet Zeitpläne nach 60 Tagen ohne Änderung im Repository ab.
      # Dieser Schritt macht deshalb höchstens einmal im Monat einen leeren Commit.
      - name: Zeitplan aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "dienstplan-bot"
            git config user.email "dienstplan-bot@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan aktiv halten"
            git push
          fi
