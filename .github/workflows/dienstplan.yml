name: Dienstplan aktualisieren

# 1) Wenn du Dateien im Projekt änderst (Push): Server bei Cloudflare neu einrichten.
# 2) Wenn jemand auf der Website auf "Aktualisieren" tippt: Dienstplan aus CareMan holen
#    und an den Server schicken. Es gibt KEINEN Zeitplan.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ziel:
        description: "Adresse der Website (leer lassen = Secret WORKER_URL)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dienstplan-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prüfen, ob alle Secrets da sind
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          fehlt=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_SECRET RESEND_API_KEY ADMIN_EMAIL ADMIN_USERNAME GH_TOKEN; do
            if [ -z "${!v}" ]; then fehlt="$fehlt $v"; fi
          done
          if [ -n "$fehlt" ]; then echo "::error::Diese Secrets fehlen in GitHub:$fehlt (GH_TOKEN = DISPATCH_TOKEN)"; exit 1; fi
          echo "Alle Secrets vorhanden."

      - name: Server bei Cloudflare anlegen
        run: npx --yes wrangler@4 deploy

      - name: Geheime Werte beim Server hinterlegen
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -c "import json,os; print(json.dumps({k: os.environ[k].strip() for k in ['APP_SECRET','RESEND_API_KEY','ADMIN_EMAIL','ADMIN_USERNAME','GH_TOKEN','GH_REPO']}))" > secrets.json
          npx --yes wrangler@4 secret bulk secrets.json
          rm -f secrets.json

  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Dienstplan bei CareMan abholen
        env:
          CAREMAN_URL: https://dienstplan.drk-dortmund.de
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASSWORD: ${{ secrets.CAREMAN_PASSWORD }}
          PLANUNGSGRUPPE: RW 18
        run: python fetch_pdf.py dienstplan.pdf

      - name: PDF auswerten
        run: python parse_dienstplan.py dienstplan.pdf data.json

      - name: Dienstplan an den Server schicken
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ZIEL: ${{ inputs.ziel != '' && inputs.ziel || secrets.WORKER_URL }}
        run: python upload_plan.py data.json "$ZIEL"

      - name: Daten auf dem GitHub-Rechner sofort löschen
        if: always()
        run: rm -rf dienstplan.pdf data.json debug
