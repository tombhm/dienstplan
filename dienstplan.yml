name: Dienstplan aktualisieren

# 1) Wenn du Dateien im Projekt änderst (Push): Server bei Cloudflare neu einrichten.
# 2) Wenn jemand auf der Website auf "Aktualisieren" tippt: Dienstplan aus CareMan holen
#    und an den Server schicken. Es gibt KEINEN Zeitplan.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ziel:
        description: "Adresse der Website (leer lassen = Secret WORKER_URL)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dienstplan-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  server:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server bei Cloudflare einrichten
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            APP_SECRET
            RESEND_API_KEY
            ADMIN_EMAIL
            ADMIN_USERNAME
            GH_TOKEN
            GH_REPO
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}

  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Dienstplan bei CareMan abholen
        env:
          CAREMAN_URL: https://dienstplan.drk-dortmund.de
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASSWORD: ${{ secrets.CAREMAN_PASSWORD }}
          PLANUNGSGRUPPE: RW 18
        run: python fetch_pdf.py dienstplan.pdf

      - name: PDF auswerten
        run: python parse_dienstplan.py dienstplan.pdf data.json

      - name: Dienstplan an den Server schicken
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ZIEL: ${{ inputs.ziel != '' && inputs.ziel || secrets.WORKER_URL }}
        run: python upload_plan.py data.json "$ZIEL"

      - name: Daten auf dem GitHub-Rechner sofort löschen
        if: always()
        run: rm -rf dienstplan.pdf data.json debug
