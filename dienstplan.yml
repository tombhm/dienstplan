name: Dienstplan aktualisieren

# Läuft NUR, wenn jemand auf der Website auf "Aktualisieren" tippt
# (oder du hier unter Actions auf "Run workflow" klickst). Kein Zeitplan.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dienstplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programme installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Dienstplan bei CareMan abholen
        env:
          CAREMAN_URL: https://dienstplan.drk-dortmund.de
          CAREMAN_USER: ${{ secrets.CAREMAN_USER }}
          CAREMAN_PASSWORD: ${{ secrets.CAREMAN_PASSWORD }}
          PLANUNGSGRUPPE: RW 18
        run: python fetch_pdf.py dienstplan.pdf

      - name: PDF auswerten
        run: python parse_dienstplan.py dienstplan.pdf data.json

      - name: Website bauen (verschlüsselt)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          mkdir -p site
          python build_site.py data.json site/index.html

      - name: Unverschlüsselte Daten sofort löschen
        if: always()
        run: rm -rf dienstplan.pdf data.json debug

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
